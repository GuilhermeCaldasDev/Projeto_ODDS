server {
    listen 80;
    server_name _;

    # Frontend - arquivos estáticos do build React
    root /opt/projeto-odds/frontend/dist;
    index index.html;

    # Rotas da API — proxy para o FastAPI na porta 8000
    location ~ ^/(matches|teams|groups|predictions|bracket) {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 60s;
    }

    # SPA fallback — todas as outras rotas servem o index.html (React Router)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache de assets estáticos
    location ~* \.(js|css|png|jpg|svg|ico|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public, immutable";
    }
}
